<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macaicos Clicker</title>

    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/game-ui.css">
    <link rel="stylesheet" href="css/skill-tree.css">

</head>

<body>

    <!-- Header -->

    <div id="header-panel">
        <div class="game-state">
            <button id="save-button">Salvar</button>
            <button id="load-button">📂 Carregar</button>
            <button id="reset-button">Resetar</button>
            <div id="telemetryButtonContainer"></div>
        </div>
    </div>

    <!-- Painel esquerdo -->
    <div id="center-panel">
        <div id="hud">
            <div class="counters">
                <div>Bananas: <span id="banana-count">0</span></div>
                <div>Prismatics: <span id="prismatics-count">0</span></div>
                <div>Bananas/s: <span id="bananas-per-second">0</span></div>
            </div>
        </div>
        <div id="banana-container">
            <button id="banana-button">
                <img src="assets/banana-cat.png" alt="">
            </button>
            <p id="bananas-per-second"></p>
        </div>
    </div>
    <div id="left-panel">
        <button id="open-skill-tree"></button>
        <div id="skill-tree" class="skill-tree-grid hidden">

            <button id="close-skill-tree" class="close-btn">X</button>

            <div class="skill-tooltip show"></div>


            <div id="skill-card" class="skill-card hidden">
                <!-- <button id="card-close-btn" class="close-btn">X</button> -->
                <h2 id="card-title"></h2>
                <p id="card-description"></p>
                <span id="card-price"></span>
                <span id="card-progress"></span>
                <button id="card-buy-btn">Comprar</button>
            </div>

            <div id="monkey-card" class="skill-card hidden">
                <h2 id="monkey-card-title"></h2>
                <p id="monkey-card-description"></p>
                <span id="monkey-card-price"></span>
                <span id="monkey-card-progress"></span>
                <button id="monkey-card-buy-btn">Comprar</button>
            </div>

            <!-- CLICK SKILLS -->
            <button id="click-boost1" class="skill-node click locked">ckb1</button>
            <div class="vertical-line ckb1-ckb2"></div>
            <button id="click-boost2" class="skill-node click locked">ckb2</button>
            <div class="vertical-line ckb2-ckb3"></div>
            <button id="click-boost3" class="skill-node click locked">ckb3</button>
            <div class="diagonal-line-left ckb2-ccc"></div>
            <div class="diagonal-line-right ckb2-ccm"></div>
            <button id="crit-chance-boost" class="skill-node click locked">ccc</button>
            <button id="crit-multiplier-boost" class="skill-node click locked">ccm</button>
            <div class="horizontal-line ckb2-ac1"></div>
            <button id="auto-click1" class="skill-node click locked">ac1</button>
            <div class="vertical-line ac1-ac2"></div>
            <button id="auto-click2" class="skill-node click locked">ac2</button>
            <div class="diagonal-line-left ac2-acc"></div>
            <div class="diagonal-line-right ac2-acm"></div>
            <button id="auto-click-chance" class="skill-node click locked">acc</button>
            <button id="auto-click-crit" class="skill-node click locked">acm</button>
            <div class="vertical-line ac2-hca"></div>
            <div class="vertical-line ac2-hcb"></div>
            <div class="vertical-line ac2-hcc"></div>
            <button id="hold-click1" class="skill-node click locked">hc</button>

            <!-- BANANA SKILLS -->
            <div class="vertical-line ckb1-bb1a"></div>
            <div class="vertical-line ckb1-bb1b"></div>
            <button id="banana-boost1" class="skill-node banana locked">bb1</button>
            <div class="vertical-line bb1-bb2"></div>
            <button id="banana-boost2" class="skill-node banana locked">bb2</button>
            <div class="vertical-line bb2-bb3"></div>
            <button id="banana-boost3" class="skill-node banana locked">bb3</button>
            <div class="vertical-line bb3-be1"></div>
            <button id="banana-evo1" class="skill-node banana locked">be1</button>
            <div class="vertical-line be1-be2"></div>
            <button id="banana-evo2" class="skill-node banana locked">be2</button>

            <!-- MINE SKILLS -->
            <div class="horizontal-line ckb1-me1a"></div>
            <div class="horizontal-line ckb1-me1b"></div>
            <div class="horizontal-line ckb1-me1c"></div>
            <button id="mine-eficiency1" class="skill-node mine locked">me1</button>
            <div class="horizontal-line me1-me2"></div>
            <button id="mine-eficiency2" class="skill-node mine locked">me2</button>
            <div class="diagonal-line-left me2-ma"></div>
            <button id="mine-automation" class="skill-node mine locked">ma</button>

            <!-- MONKEY SKILLS -->
            <button id="m1" class="skill-node monkey locked">m1</button>
            <div class="horizontal-line m1-m2"></div>
            <button id="m2" class="skill-node monkey locked">m2</button>
            <div class="horizontal-line m2-m3"></div>
            <button id="m3" class="skill-node monkey locked">m3</button>
            <div class="horizontal-line m3-m4"></div>
            <button id="m4" class="skill-node monkey locked">m4</button>
            <div class="horizontal-line m4-m5"></div>
            <button id="m5" class="skill-node monkey locked">m5</button>
            <div class="horizontal-line m5-m6"></div>
            <button id="m6" class="skill-node monkey locked">m6</button>
            <div class="horizontal-line m6-m7"></div>
            <button id="m7" class="skill-node monkey locked">m7</button>
            <div class="horizontal-line m7-m8"></div>
            <button id="m8" class="skill-node monkey locked">m8</button>
            <div class="horizontal-line m8-m9"></div>
            <button id="m9" class="skill-node monkey locked">m9</button>
            <div class="horizontal-line m9-m10"></div>
            <button id="m10" class="skill-node monkey locked">m10</button>
            <div class="horizontal-line m10-m11 locked"></div>
            <button id="m11" class="skill-node monkey locked">m11</button>
            <div class="horizontal-line m11-m12"></div>
            <button id="m12" class="skill-node monkey locked">m12</button>
            <div class="horizontal-line m12-m13"></div>
            <button id="m13" class="skill-node monkey locked">m13</button>
            <div class="horizontal-line m13-m14"></div>
            <button id="m14" class="skill-node monkey locked">m14</button>
            <div class="horizontal-line m14-m15"></div>
            <button id="m15" class="skill-node monkey locked">m15</button>

        </div>
    </div>

    <!-- Painel direito -->
    <div id="right-panel">
        <h3>Monkey Upgrades & Constructions</h3>
        <div id="upgrades-container">
            <!-- Lista de upgrades -->
        </div>

        <!-- Construções -->
        <div id="buildings">
            <!-- <h2>Construções</h2> -->
            <div id="buildings-container"></div>
        </div>
    </div>

    <!-- Comentados por enquanto -->
    <!--
        <div id="playlist-container"></div>
        <div id="skills-container"></div>
        <div id="dancing-monkey"><img src="assets/monkey-dancing.gif" alt=""></div>
        -->
    <script type="module" src="./js/Main.js"></script>
</body>

</html>
